<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simp3 Navbar Redesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1e1b4b, #9333ea, #ec4899); min-height: 100vh; }
  </style>
</head>
<body class="text-white">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 bg-white/10 backdrop-blur-xl border-b border-white/10 shadow-lg">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
      <!-- Left: Logo -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-black flex items-center justify-center text-white font-semibold text-lg">S</div>
        <span class="font-semibold text-xl tracking-tight">simp3</span>
      </div>

      <!-- Right: Nav -->
      <nav class="hidden md:flex items-center gap-2">
        <a href="#" class="px-4 py-2 rounded-xl bg-white/15 text-white font-semibold transition-all hover:bg-white/25 hover:text-white">Dashboard</a>
        <a href="#" class="px-4 py-2 rounded-xl text-white/90 font-medium hover:text-white hover:bg-white/10 transition-all">Chat</a>
        <a href="#" class="px-4 py-2 rounded-xl text-white/90 font-medium hover:text-white hover:bg-white/10 transition-all">Profile</a>
        <a href="#" class="px-4 py-2 rounded-xl text-white/90 font-medium hover:text-white hover:bg-white/10 transition-all">Logout</a>
      </nav>

      <!-- Mobile Icon Placeholder -->
      <button class="md:hidden text-white/90 hover:text-white p-2 rounded-lg hover:bg-white/10">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Hero Content for Preview -->
  <main class="max-w-4xl mx-auto text-center mt-24 px-6">
    <h1 class="text-4xl md:text-6xl font-extrabold mb-4">Your Paid Chat is Live 🎉</h1>
    <p class="text-white/80 text-lg max-w-2xl mx-auto mb-8">Share your creator link and start connecting with fans instantly. This is the new navbar style for simp3 desktop view.</p>
    <a href="#" class="inline-block px-6 py-3 rounded-xl bg-sky-400 text-gray-900 font-semibold hover:bg-sky-300 transition">View Dashboard</a>
  </main>

</body>
</html>
